<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>about us — quilter, the venture house</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      color: #e8e8e8;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back {
      position: absolute;
      top: 24px;
      left: 24px;
      font-size: 11px;
      color: #444;
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }

    .back:hover { color: #e8e8e8; }

    .team {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px 48px;
      max-width: min(480px, 90vw);
    }

    .person {
      text-align: center;
      min-width: 110px;
    }

    .person-name {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #e8e8e8;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: opacity 0.2s;
      margin-bottom: 4px;
    }

    .person-name:hover { opacity: 0.5; }

    .person-fund {
      font-size: 11px;
      font-weight: 400;
      color: #555;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <a class="back" href="/">← home</a>

  <div class="team">
    <div class="person">
      <a class="person-name" href="https://www.linkedin.com/in/fritz-dutz/" target="_blank" rel="noopener noreferrer">fritz dutz</a>
      <p class="person-fund">target global</p>
    </div>
    <div class="person">
      <a class="person-name" href="https://www.linkedin.com/in/elianmcc/" target="_blank" rel="noopener noreferrer">elian mccarron</a>
      <p class="person-fund">entrepreneur first</p>
    </div>
    <div class="person">
      <a class="person-name" href="https://www.linkedin.com/in/sam-thurman/" target="_blank" rel="noopener noreferrer">sam thurman</a>
      <p class="person-fund">futurepresent</p>
    </div>
  </div>
</body>
</html>
